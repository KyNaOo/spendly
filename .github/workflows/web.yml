name: web

# Projet solo : tout se fait sur main (pas de PR). Le workflow ne tourne que si
# le front (ou ce fichier) a changé ; workflow_dispatch permet un lancement manuel.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

# Un nouveau push annule le run précédent encore en cours sur la même branche.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint + Prettier)
        run: npm run lint

      # Vitest + jsdom : aucun navigateur requis, exécution unique (--watch=false).
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
