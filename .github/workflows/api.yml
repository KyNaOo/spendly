name: api

# Projet solo : tout se fait sur main (pas de PR). Le workflow ne tourne que si
# le code de l'API (ou ce fichier) a changé ; workflow_dispatch permet un lancement manuel.
on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api.yml"
  workflow_dispatch:

permissions:
  contents: read

# Un nouveau push annule le run précédent encore en cours sur la même branche.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: mvn verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: api/pom.xml

      # Docker est disponible sur ubuntu-latest : Testcontainers y démarre PostgreSQL.
      # verify = compilation + tests (unitaires, Testcontainers, ArchUnit) + Spotless + Checkstyle.
      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-reports
          path: |
            api/target/surefire-reports/
            api/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7
